server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Without the trailing slash, MkDocs' relative links would point outside /wiki/.
    location = /wiki {
        return 301 /wiki/;
    }

    # Material's CSS and JS have a hash in their name: long-lived cache.
    location /wiki/assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /wiki/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
        error_page 404 /wiki/404.html;
    }
}
