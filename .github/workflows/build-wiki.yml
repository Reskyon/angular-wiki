name: Build Angular Wiki

on:
  pull_request:
    paths:
      - 'site/**'
      - 'Dockerfile'
      - 'wiki-ref'
      - '.github/workflows/build-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s site/scripts -p 'test_*.py'
      - run: docker build --tag angular-wiki-check .
