server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Sin barra final los enlaces relativos de MkDocs apuntarían fuera de /wiki/.
    location = /wiki {
        return 301 /wiki/;
    }

    # CSS y JS de Material llevan un hash en el nombre: cache largo.
    location /wiki/assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /wiki/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
        error_page 404 /wiki/404.html;
    }
}
